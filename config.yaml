model:
  default: cb-official
  provider: litellm-gw
  base_url: http://127.0.0.1:4000/v1
  key_env: HERMES_LITELLM_API_KEY
  api_mode: chat_completions
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 500
  verbose: false
  reasoning_effort: medium
  personalities: {}
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  backend: firecrawl
  use_gateway: true
browser:
  inactivity_timeout: 120
  cloud_provider: browser-use
  use_gateway: true
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  progress_notices: false
  threshold: 0.85
  target_ratio: 0.5
  protect_last_n: 40
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 20000
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
tts:
  provider: openai
  use_gateway: true
stt:
  enabled: true
  provider: openai
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
  use_gateway: true
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 250
skills:
  creation_nudge_interval: 15
kanban:
  review_dispatch: true
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
telemetry:
  shared_metrics:
    enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 49
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
  - hermes-cli
  telegram:
  - hermes-telegram
  discord:
  - hermes-discord
  whatsapp:
  - hermes-whatsapp
  slack:
  - hermes-slack
  signal:
  - hermes-signal
  homeassistant:
  - hermes-homeassistant
  qqbot:
  - hermes-qqbot
  yuanbao:
  - hermes-yuanbao
  teams:
  - hermes-teams
  google_chat:
  - hermes-google_chat
image_gen:
  use_gateway: true
onboarding:
  seen:
    busy_input_prompt: true
approvals:
  destructive_slash_confirm: false
platforms: {}
mcp_servers:
  filesystem:
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - /home/bfyalong
    env: {}
providers:
  litellm-gw:
    api_key: dummy
    base_url: http://127.0.0.1:4000/v1
    context_length: 131072
    models:
      cb-official:
        context_length: 131072
      cb-hy4:
        context_length: 131072
      cb-cli:
        context_length: 131072
      mistral-mini:
        context_length: 32768
      ollama-local:
        context_length: 65536
      cf-qwen:
        context_length: 32768
fallback_providers:
- provider: litellm-gw
  model: cb-hy4
  base_url: http://127.0.0.1:4000/v1
  key_env: HERMES_LITELLM_API_KEY
- provider: custom
  model: ministral-8b-2512
  base_url: https://api.mistral.ai/v1
  key_env: MISTRAL_API_KEY
- provider: openrouter
  model: nvidia/nemotron-3.5-lightning:free
  base_url: https://openrouter.ai/api/v1
- provider: openrouter
  model: meituan/longcat-2.0:free
  base_url: https://openrouter.ai/api/v1
- provider: litellm-gw
  model: ollama-local
  base_url: http://127.0.0.1:4000/v1
  key_env: HERMES_LITELLM_API_KEY
